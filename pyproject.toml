[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eu4m-ai-workshop"
version = "1.0.0"
description = "Verified AI literacy workshop for academic and mechatronics tasks"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.0,<4",
  "matplotlib>=3.7,<4",
  "jupyter>=1.0,<2",
  "nbformat>=5.9,<6",
  "nbclient>=0.8,<1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
addopts = "-ra"
filterwarnings = ["ignore:FigureCanvasAgg is non-interactive"]
