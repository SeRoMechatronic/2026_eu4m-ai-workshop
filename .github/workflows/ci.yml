name: validate-materials

on:
  push:
  pull_request:

jobs:
  validate:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}${{ matrix.pandas_pin && ' · pandas<3' || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.11"}
          # Windows: es la plataforma del docente y la que revela problemas de saltos de línea.
          - {os: windows-latest, python: "3.11"}
          # Mínimo admitido, con la serie anterior de pandas.
          - {os: ubuntu-latest, python: "3.10", pandas_pin: "pandas<3"}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Pin pandas
        if: matrix.pandas_pin
        run: python -m pip install "${{ matrix.pandas_pin }}"
      - name: Regenerate committed artifacts
        run: |
          export PYTHONPATH=src
          python scripts/generate_dataset.py > /dev/null
          python instructor/generate_challenge_cases.py > /dev/null
          python scripts/build_notebooks.py > /dev/null
          python scripts/build_agenda.py > /dev/null
      - name: Committed artifacts are up to date
        run: git diff --exit-code -- data results notebooks instructor docs
      - name: Execute notebooks with a real Jupyter kernel
        run: |
          mkdir -p "$RUNNER_TEMP/executed"
          for notebook in 00_access_check 03_actuator_case_student 03_actuator_case_solution; do
            jupyter nbconvert --to notebook --execute "notebooks/$notebook.ipynb" \
              --output-dir "$RUNNER_TEMP/executed" --ExecutePreprocessor.timeout=180
          done
      - run: python scripts/run_all.py
      - name: Student pack is safe to publish
        run: python scripts/build_packs.py
        env:
          PYTHONPATH: src
